[[instance]]
id        = "coordinator"
lifecycle = "classic_lifecycle"
upper     = "human"
lower     = "coordinator"

[[instance]]
id        = "planner"
lifecycle = "classic_lifecycle"
upper     = "human"
lower     = "planner"

[[instance]]
id        = "reporter"
lifecycle = "classic_lifecycle"
upper     = "human"
lower     = "reporter"

[[instance]]
id        = "research_team"
lifecycle = "classic_lifecycle"
upper     = "human"
lower     = "research_team"

[[instance]]
id        = "researcher"
lifecycle = "classic_lifecycle"
upper     = "research_team"
lower     = "researcher"

[[instance]]
