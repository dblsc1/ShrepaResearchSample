# PPOtestTradingAgents: TradingAgents (TauricResearch/TradingAgents 9fa1196, default config) as Sherpa delegation.
# The judges are the uppers: the Portfolio Manager under the person, the Research Manager under the Portfolio Manager.
# TradingAgents' fixed graph edges become fixed_order: who must wait for whom (after.*), whom a judge must have
# dispatched before it hands back (needs.*); parallel_wait_all makes those tasks end first. Every node runs once in
# TradingAgents' default config (one debate round), so no task is sent back (reopen_limit 0). An analyst hands back
# only its own report (seat_write_limit). Card text is TradingAgents' own prompt.

# A cancelled task does not count as ended (mero #18874, #19191): without this an upper could cancel what a task
# waits for and let it take off early. In TradingAgents no node can be skipped that way.
[policy.waits_for]
params = "ended=closed"

