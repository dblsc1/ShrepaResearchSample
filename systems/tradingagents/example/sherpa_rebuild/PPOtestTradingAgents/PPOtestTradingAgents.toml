[policy.reopen_limit]
params = "portfolio_manager=0;research_manager=0;market_analyst=0;sentiment_analyst=0;news_analyst=0;fundamentals_analyst=0;bull_researcher=0;bear_researcher=0;memory_log=0;trader=0;aggressive_analyst=0;conservative_analyst=0;neutral_analyst=0"

# R3 (each analyst runs only its own tools), R4 (no data after the run's date), R5 (only the run's instrument):
# TradingAgents' tools become MCP tools of one server "trading", one tool per TradingAgents tool, the
# arguments TradingAgents injects (symbol/ticker, dates) passed explicitly. The upper types the run's
# --ticker and --date on every analyst dispatch; @ticker and @date read them from the task card.
# TradingAgents rewrites a wrong symbol or a later date and hides both from the model; here the call is
# refused and the reason names the allowed value. Two tools take no date (get_insider_transactions,
# get_prediction_markets): TradingAgents limits them "as of" the run date by injection; here only the
# tool itself can be allowed or refused. The non-analyst seats call no data tool (in TradingAgents they
# have no tools). Every seat has the work tools of a Sherpa task: read reports and src, sherpa under its
# own license, git add, and git commit only as `git commit -m <plain message>`: no long option, no short option
# but -m, no character but letters, digits, space and ._/- (that shuts out --no-verify, its abbreviations,
# clusters like -an, a quoted '-n' and a tab-separated -n; a tab could not be written here anyway: params
# go into a TSV table); the price is a plain message;
# an analyst writes only its own report. sherpa --inst is refused here; an abbreviation (--ins) gets past this
# rule but the kernel refuses it (identity.mismatch with SHERPA_INST), and debrief re-runs the write checks.
[policy.seat_tool_allowlist]
params = """\
market_analyst=mcp__trading__get_stock_data(symbol=@ticker,end_date<=@date),mcp__trading__get_indicators(symbol=@ticker,curr_date<=@date),mcp__trading__get_verified_market_snapshot(symbol=@ticker,curr_date<=@date),Write(reports/market_analyst.md),Edit(reports/market_analyst.md),Read(reports/**),Read(src/**),Bash(sherpa *,command!~*--inst*),Bash(git add *),Bash(git commit -m *,command!~*--*,command!~* -[!m]*,command!~*[!a-zA-Z0-9 ._/-]*);\
sentiment_analyst=Write(reports/sentiment_analyst.md),Edit(reports/sentiment_analyst.md),Read(reports/**),Read(src/**),Bash(sherpa *,command!~*--inst*),Bash(git add *),Bash(git commit -m *,command!~*--*,command!~* -[!m]*,command!~*[!a-zA-Z0-9 ._/-]*);\
news_analyst=mcp__trading__get_news(ticker=@ticker,end_date<=@date),mcp__trading__get_global_news(curr_date<=@date),mcp__trading__get_macro_indicators(curr_date<=@date),mcp__trading__get_prediction_markets,Write(reports/news_analyst.md),Edit(reports/news_analyst.md),Read(reports/**),Read(src/**),Bash(sherpa *,command!~*--inst*),Bash(git add *),Bash(git commit -m *,command!~*--*,command!~* -[!m]*,command!~*[!a-zA-Z0-9 ._/-]*);\
fundamentals_analyst=mcp__trading__get_fundamentals(ticker=@ticker,curr_date<=@date),mcp__trading__get_balance_sheet(ticker=@ticker,curr_date<=@date),mcp__trading__get_cashflow(ticker=@ticker,curr_date<=@date),mcp__trading__get_income_statement(ticker=@ticker,curr_date<=@date),mcp__trading__get_insider_transactions(ticker=@ticker),Write(reports/fundamentals_analyst.md),Edit(reports/fundamentals_analyst.md),Read(reports/**),Read(src/**),Bash(sherpa *,command!~*--inst*),Bash(git add *),Bash(git commit -m *,command!~*--*,command!~* -[!m]*,command!~*[!a-zA-Z0-9 ._/-]*);\
portfolio_manager=Write(src/**),Edit(src/**),Read(reports/**),Read(src/**),Bash(sherpa *,command!~*--inst*),Bash(git add *),Bash(git commit -m *,command!~*--*,command!~* -[!m]*,command!~*[!a-zA-Z0-9 ._/-]*);\
research_manager=Write(src/**),Edit(src/**),Read(reports/**),Read(src/**),Bash(sherpa *,command!~*--inst*),Bash(git add *),Bash(git commit -m *,command!~*--*,command!~* -[!m]*,command!~*[!a-zA-Z0-9 ._/-]*);\
memory_log=Write(src/**),Edit(src/**),Read(reports/**),Read(src/**),Bash(sherpa *,command!~*--inst*),Bash(git add *),Bash(git commit -m *,command!~*--*,command!~* -[!m]*,command!~*[!a-zA-Z0-9 ._/-]*);\
trader=Write(src/**),Edit(src/**),Read(reports/**),Read(src/**),Bash(sherpa *,command!~*--inst*),Bash(git add *),Bash(git commit -m *,command!~*--*,command!~* -[!m]*,command!~*[!a-zA-Z0-9 ._/-]*);\
bull_researcher=Write(src/**),Edit(src/**),Read(reports/**),Read(src/**),Bash(sherpa *,command!~*--inst*),Bash(git add *),Bash(git commit -m *,command!~*--*,command!~* -[!m]*,command!~*[!a-zA-Z0-9 ._/-]*);\
bear_researcher=Write(src/**),Edit(src/**),Read(reports/**),Read(src/**),Bash(sherpa *,command!~*--inst*),Bash(git add *),Bash(git commit -m *,command!~*--*,command!~* -[!m]*,command!~*[!a-zA-Z0-9 ._/-]*);\
aggressive_analyst=Write(src/**),Edit(src/**),Read(reports/**),Read(src/**),Bash(sherpa *,command!~*--inst*),Bash(git add *),Bash(git commit -m *,command!~*--*,command!~* -[!m]*,command!~*[!a-zA-Z0-9 ._/-]*);\
conservative_analyst=Write(src/**),Edit(src/**),Read(reports/**),Read(src/**),Bash(sherpa *,command!~*--inst*),Bash(git add *),Bash(git commit -m *,command!~*--*,command!~* -[!m]*,command!~*[!a-zA-Z0-9 ._/-]*);\
neutral_analyst=Write(src/**),Edit(src/**),Read(reports/**),Read(src/**),Bash(sherpa *,command!~*--inst*),Bash(git add *),Bash(git commit -m *,command!~*--*,command!~* -[!m]*,command!~*[!a-zA-Z0-9 ._/-]*)"""

# R8 (an analyst calls tools at most max_tool_rounds = 20 rounds): at most 26 tool calls per analyst task,
# 20 for data plus 6 work calls (brief, takeoff, write the report, git add, git commit, debrief).
# TradingAgents counts model rounds that call tools and gives a last round without tools to write the
# report; here every call counts and the 27th is refused, report-writing and debrief included.
[policy.tool_call_limit]
params = "market_analyst=26;sentiment_analyst=26;news_analyst=26;fundamentals_analyst=26"
